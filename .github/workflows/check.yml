name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# linux arm bills at 1x where hosted macos bills at 10x, and every host here
# evaluates fine from linux: darwin configs need no build to produce a drv
# path. the one thing this cannot do is build the darwin closure, which the
# weekly lock bump does on hosted macos and nix-switch does on every switch
jobs:
  check:
    name: lint and evaluate every host
    runs-on: ubuntu-24.04-arm
    env:
      # abode is a private input. a fine-grained token with contents:read on
      # it; GITHUB_TOKEN is scoped to this repo only
      NIX_CONFIG: access-tokens = github.com=${{ secrets.NIX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # lix, not cppnix: this config is built by lix on the machine, so the gate
      # has to run the same evaluator
      - uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d # v2026-06-15
        with:
          extra_nix_config: |
            experimental-features = flakes nix-command pipe-operator
            extra-substituters = https://cache.lix.systems https://nix-community.cachix.org
            extra-trusted-public-keys = cache.lix.systems:aBnZUw8zA7H35Cz2RyKFVs3H4PlGTLawyY5KRbvJR8o= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: lint, evaluate droid and mkspi
        run: nix flake check -L

      - name: evaluate meatwizard
        run: nix eval --raw .#darwinConfigurations.meatwizard.system.drvPath
