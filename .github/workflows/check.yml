name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# two jobs rather than one, because the private inputs split the tree in half.
#
# the public job is what a fork PR gets: no secrets, abode and waves swapped
# for flakes/stub, and it must stay that way. no self-hosted runner is used
# anywhere in this file either, so a workflow from an untrusted fork cannot
# reach a real machine. the private job carries the token and is skipped on
# forks, where the token would be blank and every fetch a 404.
#
# linux arm bills at 1x where hosted macos bills at 10x, and every host here
# evaluates fine from linux: darwin configs need no build to produce a drv
# path. the one thing this cannot do is build the darwin closure, which the
# weekly lock bump does on hosted macos and nix-switch does on every switch
jobs:
  public:
    name: lint and evaluate without the private inputs
    runs-on: ubuntu-24.04-arm
    env:
      STUB: --override-input abode ./flakes/stub --override-input waves ./flakes/stub
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d # v2026-06-15
        with:
          extra_nix_config: |
            experimental-features = flakes nix-command
            extra-substituters = https://cache.lix.systems https://nix-community.cachix.org
            extra-trusted-public-keys = cache.lix.systems:aBnZUw8zA7H35Cz2RyKFVs3H4PlGTLawyY5KRbvJR8o= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: formatting
        run: nix fmt $STUB -- --ci

      - name: lint, evaluate rubicon and gotham
        run: nix flake check -L $STUB

      - name: evaluate apollo
        run: nix eval --raw $STUB .#darwinConfigurations.apollo.system.drvPath

  private:
    name: evaluate every host against the real inputs
    runs-on: ubuntu-24.04-arm
    # a fork cannot read NIX_ACCESS_TOKEN, so without this the job would fetch
    # a 404 and fail every outside contributor's pull request
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      NIX_CONFIG: access-tokens = github.com=${{ secrets.NIX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d # v2026-06-15
        with:
          extra_nix_config: |
            experimental-features = flakes nix-command
            extra-substituters = https://cache.lix.systems https://nix-community.cachix.org
            extra-trusted-public-keys = cache.lix.systems:aBnZUw8zA7H35Cz2RyKFVs3H4PlGTLawyY5KRbvJR8o= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: lint, evaluate rubicon and gotham
        run: |
          if [ -z "${{ secrets.NIX_ACCESS_TOKEN }}" ]; then
            echo "NIX_ACCESS_TOKEN repo secret not set; skipping private evaluation"
            exit 0
          fi
          nix flake check -L

      - name: evaluate apollo
        run: |
          if [ -z "${{ secrets.NIX_ACCESS_TOKEN }}" ]; then
            echo "NIX_ACCESS_TOKEN repo secret not set; skipping private evaluation"
            exit 0
          fi
          nix eval --raw .#darwinConfigurations.apollo.system.drvPath
