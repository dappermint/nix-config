name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# nothing here writes, and the runner is the machine itself: a leaked token
# with default scope would be a real prize, so pin it to read
permissions:
  contents: read

# both jobs run on meatwizard's own runner, so no step installs nix: nix-darwin
# already owns it here and installing over it would damage the live
# installation. that also makes this better parity than a hosted runner ever
# had, since the gate now runs the exact lix that switches the machine.
#
# the accepted cost is circularity. a commit that breaks modules/github-runners.nix
# takes down the runner that would have caught it, and recovery is local: fix
# the module in the checkout, `nh darwin switch /etc/nix-darwin` to get the
# agent back, then push.
#
# one runner also means these two queue rather than run in parallel. together
# they are ~20s against a warm store, so that costs nothing worth optimising.
jobs:
  lint:
    name: lint and evaluate
    runs-on: [self-hosted, m5]
    steps:
      - uses: actions/checkout@v7
        with:
          # otherwise the token sits in _work/.git/config until the agent
          # restarts, which with KeepAlive can be weeks
          persist-credentials: false

      - name: lint
        run: nix build --no-link -L .#checks.aarch64-darwin.lint

      - name: evaluate the configuration
        run: nix build --no-link -L .#checks.aarch64-darwin.eval

  system:
    name: build the system closure
    runs-on: [self-hosted, m5]
    steps:
      - uses: actions/checkout@v7
        with:
          # otherwise the token sits in _work/.git/config until the agent
          # restarts, which with KeepAlive can be weeks
          persist-credentials: false

      - name: build and smoke the system
        run: nix build --no-link -L .#checks.aarch64-darwin.smoke
